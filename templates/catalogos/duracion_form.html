{% extends "base.html" %} {% block content %}
<div class="max-w-xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
      {{ 'Editar Duración #' ~ duracion.Id if duracion else 'Nueva Duración' }}
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Configura el tiempo de duración del curso o diplomado.
    </p>
  </div>

  <div
    class="bg-white rounded-2xl card-shadow border border-slate-200 p-6 sm:p-8"
  >
    <form
      method="POST"
      class="space-y-5"
      onsubmit="return confirm('{{ '¿Deseas guardar los cambios?' if duracion else '¿Deseas registrar esta nueva duración?' }}');"
    >
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Duración (String)</label
        >
        <input
          type="text"
          name="duracion"
          required
          value="{{ duracion.Duracion if duracion else '' }}"
          placeholder="Ej. 3 Meses / 48 Horas"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
      </div>

      <div class="pt-4 flex items-center justify-end space-x-3">
        <a
          href="{{ url_for('catalogos.duracion_index') }}"
          class="px-5 py-2.5 border border-slate-300 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 transition"
          >Cancelar</a
        >
        <button
          type="submit"
          class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition"
        >
          {{ 'Actualizar Duración' if duracion else 'Guardar Duración' }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
