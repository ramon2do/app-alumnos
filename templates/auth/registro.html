{% extends "base.html" %} {% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div
    class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 sm:p-10 space-y-6"
  >
    <div class="text-center space-y-2">
      <div
        class="inline-flex bg-indigo-100 text-indigo-600 p-3 rounded-2xl text-2xl font-bold mb-2"
      >
        📝
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">
        Registro de Operador
      </h2>
      <p class="text-sm text-slate-500">
        Crea una cuenta como asistente administrativo
      </p>
    </div>
    <form
      action="{{ url_for('auth.registro') }}"
      method="POST"
      class="space-y-4"
    >
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Nombre Completo</label
        >
        <input
          type="text"
          name="nombre"
          required
          placeholder="Ej. Ana Pérez"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
      </div>
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Correo Electrónico</label
        >
        <input
          type="email"
          name="correo"
          required
          placeholder="operador@correo.com"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
      </div>
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Contraseña</label
        >
        <input
          type="password"
          name="contrasena"
          required
          placeholder="••••••••"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
      </div>
      <button
        type="submit"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-200 transition-all"
      >
        Registrarse
      </button>
    </form>
    <div class="text-center text-xs text-slate-500">
      ¿Ya tienes una cuenta?
      <a
        href="{{ url_for('auth.login') }}"
        class="text-indigo-600 font-semibold hover:underline"
        >Inicia sesión aquí</a
      >
    </div>
  </div>
</div>
{% endblock %}
