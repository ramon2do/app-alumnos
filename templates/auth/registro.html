{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto space-y-6 pt-8">
    <div class="text-center">
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Registro de Operador</h1>
        <p class="text-sm text-slate-500 mt-1">Cree su cuenta para acceder al sistema de gestión.</p>
    </div>

    <div class="bg-white rounded-2xl card-shadow border border-slate-200 p-6 sm:p-8">
        <form method="POST" class="space-y-5">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nombres</label>
                    <input type="text" name="nombres" required 
                           value="{{ form_data.nombres if form_data else '' }}" 
                           placeholder="Ej. Carlos" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Apellidos</label>
                    <input type="text" name="apellidos" required 
                           value="{{ form_data.apellidos if form_data else '' }}" 
                           placeholder="Ej. Mendoza" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Correo Electrónico</label>
                <input type="email" name="correo" required 
                       value="{{ form_data.correo if form_data else '' }}" 
                       placeholder="operador@correo.com" 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Contraseña</label>
                <input type="password" name="password" required 
                       placeholder="••••••••" 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                <p class="text-[11px] text-slate-400 mt-1">Mínimo 8 caracteres.</p>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition">Registrar Cuenta</button>
            </div>

            <div class="text-center pt-2">
                <a href="{{ url_for('auth.login') }}" class="text-xs text-indigo-600 hover:underline font-semibold">¿Ya tienes una cuenta? Inicia sesión aquí</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
