{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">{{ 'Editar Oferta #' ~ oferta.id if oferta else 'Nueva Oferta Académica' }}</h1>
        <p class="text-sm text-slate-500 mt-1">Configure los costos y modalidad de pago del programa.</p>
    </div>

    <div class="bg-white rounded-2xl card-shadow border border-slate-200 p-6 sm:p-8">
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nombre del Programa / Curso</label>
                <input type="text" name="nombre" required value="{{ form_data.nombre if form_data else (oferta.nombre if oferta else '') }}" placeholder="Ej. Diplomado en Backend" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tipo</label>
                <select name="tipo" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <option value="Diplomado" {% if (form_data and form_data.tipo == 'Diplomado') or (not form_data and oferta and oferta.tipo == 'Diplomado') %}selected{% endif %}>Diplomado</option>
                    <option value="Curso" {% if (form_data and form_data.tipo == 'Curso') or (not form_data and oferta and oferta.tipo == 'Curso') %}selected{% endif %}>Curso</option>
                    <option value="Taller" {% if (form_data and form_data.tipo == 'Taller') or (not form_data and oferta and oferta.tipo == 'Taller') %}selected{% endif %}>Taller</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Precio Total ($)</label>
                    <input type="number" step="0.01" name="precio_en_divisas" id="precio_en_divisas" required value="{{ form_data.precio_en_divisas if form_data else (oferta.precio_en_divisas if oferta else '') }}" placeholder="0.00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nro. de Cuotas</label>
                    <input type="number" name="nro_partes_cuotas" id="nro_partes_cuotas" required value="{{ form_data.nro_partes_cuotas if form_data else (oferta.nro_partes_cuotas if oferta else '1') }}" min="1" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Monto por Cuota ($)</label>
                <input type="text" id="cada_una_de_en_divisas" readonly value="{{ form_data.cada_una_de_en_divisas if form_data else (oferta.cada_una_de_en_divisas if oferta else '0.00') }}" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-600 focus:outline-none cursor-not-allowed">
                <input type="hidden" name="cada_una_de_en_divisas" id="input_oculto_cuota" value="{{ form_data.cada_una_de_en_divisas if form_data else (oferta.cada_una_de_en_divisas if oferta else '0.00') }}">
            </div>

            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{{ url_for('ofertas.index') }}" class="px-5 py-2.5 border border-slate-300 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 transition">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition">{{ 'Actualizar Oferta' if oferta else 'Guardar Oferta' }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
