{% extends "base.html" %} {% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
      {{ 'Editar Oferta #' ~ oferta.id if oferta else 'Nueva Oferta Académica'
      }}
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Configura los detalles del curso, diplomado o programa.
    </p>
  </div>

  <div
    class="bg-white rounded-2xl card-shadow border border-slate-200 p-6 sm:p-8"
  >
    <form
      method="POST"
      class="space-y-5"
      onsubmit="return confirm('{{ '¿Estás seguro de actualizar esta oferta?' if oferta else '¿Deseas registrar esta nueva oferta?' }}');"
    >
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Nombre de la Oferta Académica</label
        >
        <input
          type="text"
          name="oferta_academica"
          required
          value="{{ oferta.oferta_academica if oferta else '' }}"
          placeholder="Ej. Diplomado en Inteligencia Artificial"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
      </div>

      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5"
          >Tipo de Programa</label
        >
        <select
          name="tipo"
          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        >
          <option
            value="Diplomado"
            {%
            if
            oferta
            and
            oferta.tipo=="Diplomado"
            %}selected{%
            endif
            %}
          >
            Diplomado
          </option>
          <option
            value="Curso"
            {%
            if
            oferta
            and
            oferta.tipo=="Curso"
            %}selected{%
            endif
            %}
          >
            Curso
          </option>
          <option
            value="Taller"
            {%
            if
            oferta
            and
            oferta.tipo=="Taller"
            %}selected{%
            endif
            %}
          >
            Taller
          </option>
          <option
            value="Certificación"
            {%
            if
            oferta
            and
            oferta.tipo=="Certificación"
            %}selected{%
            endif
            %}
          >
            Certificación
          </option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- Ejemplo para Precio en Divisas -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Precio Total ($)</label>
            <input type="number" step="0.01" name="precio_en_divisas" id="precio_en_divisas" 
                  value="{{ oferta.precio_en_divisas.valor if oferta and oferta.precio_en_divisas.valor is defined else (oferta.precio_en_divisas if oferta else '') }}" 
                  required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Ejemplo para Número de Cuotas -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nro. de Cuotas</label>
            <input type="number" name="nro_partes_cuotas" id="nro_partes_cuotas" 
                  value="{{ oferta.nro_partes_cuotas if oferta else '1' }}" 
                  min="1" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Campo calculado de cada cuota -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Valor de Cada Cuota ($)</label>
            <input type="text" id="cada_una_de_en_divisas" readonly 
                  value="{{ oferta.cada_una_de_en_divisas if oferta else '' }}" 
                  class="w-full bg-slate-200 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-700 font-bold cursor-not-allowed">
            <!-- Campo oculto para enviar el valor de la cuota al backend si es necesario -->
            <input type="hidden" name="cada_una_de_en_divisas" id="input_oculto_cuota" value="{{ oferta.cada_una_de_en_divisas if oferta else '' }}">
        </div>
      </div>

      <div class="pt-4 flex items-center justify-end space-x-3">
        <a
          href="{{ url_for('ofertas.index') }}"
          class="px-5 py-2.5 border border-slate-300 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 transition"
          >Cancelar</a
        >
        <button
          type="submit"
          class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition"
        >
          {{ 'Actualizar Oferta' if oferta else 'Guardar Oferta' }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
