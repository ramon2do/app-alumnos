{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Nueva Inscripción</h1>
        <p class="text-sm text-slate-500 mt-1">Busque al alumno por cédula y seleccione la oferta académica.</p>
    </div>

    <div class="bg-white rounded-2xl card-shadow border border-slate-200 p-6 sm:p-8">
        <form method="POST" class="space-y-6">
            
            <!-- Búsqueda de Alumno -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Buscar Alumno por Cédula (Presione Enter)</label>
                <div class="grid grid-cols-3 gap-2">
                    <select id="tipo_cedula" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <option value="V">V</option>
                        <option value="E">E</option>
                    </select>
                    <div class="col-span-2">
                        <input type="text" id="nro_cedula" value="{{ form_data.nro_cedula if form_data else '' }}" placeholder="Ingrese número y presione Enter" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                </div>
                <input type="hidden" name="id_alumno" id="id_alumno" value="{{ form_data.id_alumno if form_data else '' }}">
                <p id="error_alumno" class="text-xs text-red-500 hidden font-semibold">Alumno no encontrado en el sistema.</p>
            </div>

            <!-- Información del Alumno Encontrado -->
            <div id="info_alumno" class="hidden p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl flex items-center space-x-4">
                <img id="alumno_foto" src="/static/uploads/default.png" alt="Foto" class="w-16 h-16 object-cover rounded-xl border border-indigo-200 shadow-sm">
                <div class="space-y-1 text-sm">
                    <p class="font-bold text-slate-900" id="alumno_nombre">-</p>
                    <p class="text-xs text-slate-600">Correo: <span id="alumno_correo" class="font-medium">-</span></p>
                    <p class="text-xs text-slate-600">WhatsApp: <span id="alumno_whatsapp" class="font-medium">-</span></p>
                </div>
            </div>

            <!-- Selección de Oferta Académica -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Oferta Académica</label>
                <select name="id_oferta" id="select_oferta" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <option value="">Seleccione un programa...</option>
                    {% for oferta in ofertas %}
                    <option value="{{ oferta.id }}" 
                            data-tipo="{{ oferta.tipo }}" 
                            data-precio="{{ oferta.precio_en_divisas }}" 
                            data-cuotas="{{ oferta.nro_partes_cuotas }}" 
                            data-montocuota="{{ oferta.cada_una_de_en_divisas }}"
                            {% if form_data and form_data.id_oferta == oferta.id|string %}selected{% endif %}>
                        {{ oferta.nombre }} ({{ oferta.tipo }}) - ${{ oferta.precio_en_divisas }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Información Detallada de la Oferta -->
            <div id="info_oferta" class="hidden p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs text-slate-700">
                <div class="flex justify-between"><span>Tipo de Programa:</span><span id="oferta_tipo" class="font-bold">-</span></div>
                <div class="flex justify-between"><span>Precio Total:</span><span id="oferta_precio" class="font-bold text-indigo-600">-</span></div>
                <div class="flex justify-between"><span>Número de Cuotas:</span><span id="oferta_cuotas" class="font-bold">-</span></div>
                <div class="flex justify-between"><span>Monto por Cuota:</span><span id="oferta_montocuota" class="font-bold">-</span></div>
            </div>

            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{{ url_for('inscripciones.index') }}" class="px-5 py-2.5 border border-slate-300 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 transition">Cancelar</a>
                <button type="submit" id="btn_submit" disabled class="px-6 py-2.5 bg-indigo-300 text-white text-sm font-semibold rounded-xl cursor-not-allowed transition shadow-sm">Registrar Inscripción</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
